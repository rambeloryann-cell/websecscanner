version: '3.9'

services:
  app:
    build: ./app
    container_name: websecscanner_app
    ports:
      - "5000:5000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - websec_net
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: websecscanner_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/1_init.sql:/docker-entrypoint-initdb.d/1_init.sql
      - ./db/2_seed.sql:/docker-entrypoint-initdb.d/2_seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - websec_net
    restart: unless-stopped

volumes:
  db_data:

networks:
  websec_net:
    driver: bridge
