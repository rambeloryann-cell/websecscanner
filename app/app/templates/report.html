<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSecScanner — Rapport</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root{--navy:#1a2235;--dark:#0e1119;--blue:#4f83cc;--muted:#8892a4;--border:#2e3d52;--surface:#1e2d42}
    *{box-sizing:border-box}
    body{background:#141c2b;font-family:'Inter',system-ui,sans-serif;color:#c9d1e0;min-height:100vh;margin:0}
    .sidebar{width:220px;background:var(--dark);border-right:1px solid var(--border);min-height:100vh;position:fixed;top:0;left:0;display:flex;flex-direction:column;z-index:100}
    .sidebar-brand{display:flex;align-items:center;gap:8px;padding:18px 20px;border-bottom:1px solid var(--border);font-size:14px;font-weight:500;color:#fff;text-decoration:none}
    .brand-icon{width:26px;height:26px;background:var(--blue);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex-shrink:0}
    .sidebar-section{font-size:10px;font-weight:600;color:rgba(255,255,255,0.25);letter-spacing:1.2px;text-transform:uppercase;padding:20px 20px 6px}
    .nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13px;color:rgba(255,255,255,0.4);text-decoration:none;border-left:2px solid transparent;transition:all 0.15s}
    .nav-item:hover{color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)}
    .nav-item.active{color:#fff;background:rgba(79,131,204,0.1);border-left-color:var(--blue)}
    .nav-item .bi{font-size:15px}
    .sidebar-footer{margin-top:auto;border-top:1px solid var(--border);padding:14px 20px}
    .user-row{display:flex;align-items:center;gap:10px}
    .user-avatar{width:30px;height:30px;background:var(--blue);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0}
    .user-name{font-size:13px;color:rgba(255,255,255,0.75)}
    .user-email{font-size:11px;color:var(--muted)}
    .logout-btn{margin-left:auto;background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:0}
    .logout-btn:hover{color:#f87171}
    .main{margin-left:220px}
    .topbar{background:var(--dark);border-bottom:1px solid var(--border);padding:14px 32px;display:flex;align-items:center;justify-content:space-between}
    .topbar-title{font-size:15px;font-weight:500;color:#fff}
    .topbar-sub{font-size:12px;color:var(--muted);margin-top:1px;font-family:'IBM Plex Mono',monospace}
    .action-btn{background:none;border:1px solid var(--border);color:rgba(255,255,255,0.45);font-size:12px;padding:6px 14px;border-radius:4px;text-decoration:none;transition:all 0.15s}
    .action-btn:hover{border-color:var(--blue);color:#6a9fd8}
    .content{padding:24px 32px}
    .summary-bar{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px 24px;margin-bottom:20px;display:grid;grid-template-columns:auto 1fr auto auto auto;gap:24px;align-items:center}
    .score-num{font-size:56px;font-weight:200;letter-spacing:-3px;line-height:1}
    .score-num.good{color:#4ade80}
    .score-num.mid{color:#fbbf24}
    .score-num.bad{color:#f87171}
    .score-lbl{font-size:11px;color:var(--muted);margin-top:2px}
    .url-info .url{font-family:'IBM Plex Mono',monospace;font-size:13px;color:#c9d1e0;word-break:break-all}
    .url-info .meta{font-size:11px;color:var(--muted);margin-top:5px;display:flex;gap:14px;flex-wrap:wrap}
    .summary-stat{text-align:center;min-width:70px}
    .summary-stat .val{font-size:22px;font-weight:300;color:#fff}
    .summary-stat .lbl{font-size:11px;color:var(--muted);margin-top:2px}
    .filter-row{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
    .filter-pill{font-size:11px;padding:4px 12px;border-radius:4px;border:1px solid var(--border);color:rgba(255,255,255,0.4);cursor:pointer;background:transparent;transition:all 0.15s}
    .filter-pill:hover{color:rgba(255,255,255,0.7)}
    .filter-pill.active{border-color:var(--blue);color:#7ab3e0;background:rgba(79,131,204,0.08)}
    .results-wrap{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
    .results-wrap table{width:100%;border-collapse:collapse;margin:0}
    .results-wrap th{font-size:10px;color:var(--muted);letter-spacing:0.8px;text-transform:uppercase;font-weight:500;padding:10px 18px;text-align:left;background:rgba(0,0,0,0.1);border-bottom:1px solid var(--border)}
    .results-wrap td{padding:11px 18px;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:top}
    .results-wrap tr:last-child td{border-bottom:none}
    .results-wrap tr:hover td{background:rgba(255,255,255,0.02)}
    .check-name{font-family:'IBM Plex Mono',monospace;color:#c9d1e0;font-size:12px}
    .desc-cell{color:rgba(255,255,255,0.5);line-height:1.5;font-size:12px}
    .rec-cell{color:rgba(255,255,255,0.35);font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.5}
    .bx{display:inline-block;font-size:10px;font-weight:500;padding:2px 8px;border-radius:3px}
    .bx-ok{background:rgba(74,222,128,0.1);color:#4ade80}
    .bx-fail{background:rgba(248,113,113,0.12);color:#f87171}
    .bx-na{background:rgba(148,163,184,0.08);color:#64748b}
    .bx-crit{background:rgba(239,68,68,0.12);color:#f87171}
    .bx-high{background:rgba(245,158,11,0.12);color:#fbbf24}
    .bx-med{background:rgba(251,191,36,0.08);color:#fde68a}
    .bx-low{background:rgba(148,163,184,0.08);color:#94a3b8}
    .bx-pass{background:rgba(79,131,204,0.1);color:#7ab3e0}
    .bx-actf{background:rgba(245,158,11,0.1);color:#fbbf24}
    .empty-state{padding:40px;text-align:center;color:var(--muted);font-size:13px}
    .loading-box{text-align:center;padding:60px 20px}
    .spin{display:inline-block;font-size:28px;color:var(--blue);animation:spin 1s linear infinite}
    @keyframes spin{100%{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div class="sidebar">
  <a href="/dashboard" class="sidebar-brand">
    <div class="brand-icon"><i class="bi bi-shield-check"></i></div>
    WebSecScanner
  </a>
  <div class="sidebar-section">Principal</div>
  <a class="nav-item" href="/dashboard"><i class="bi bi-grid-1x2"></i>Dashboard</a>
  <a class="nav-item" href="/scan"><i class="bi bi-search"></i>Nouveau scan</a>
  <a class="nav-item active" href="#"><i class="bi bi-file-text"></i>Rapport</a>
  <div class="sidebar-footer">
    <div class="user-row">
      <div class="user-avatar" id="ua">?</div>
      <div><div class="user-name" id="un">...</div><div class="user-email" id="ue">...</div></div>
      <button class="logout-btn" onclick="logout()"><i class="bi bi-box-arrow-right"></i></button>
    </div>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <div>
      <div class="topbar-title">Rapport de scan</div>
      <div class="topbar-sub" id="topbar-url">Chargement...</div>
    </div>
    <a href="/scan" class="action-btn"><i class="bi bi-plus-lg me-1"></i>Nouveau scan</a>
  </div>
  <div class="content" id="content">
    <div class="loading-box">
      <div class="spin"><i class="bi bi-arrow-repeat"></i></div>
      <div style="margin-top:12px;font-size:13px;color:var(--muted)">Chargement du rapport...</div>
    </div>
  </div>
</div>

<script>
const SCAN_ID = {{ scan_id }};
let allResults = [];

const SEV_BADGE = {critical:'bx-crit',high:'bx-high',medium:'bx-med',low:'bx-low'};
const SEV_LABEL = {critical:'Critique',high:'Élevé',medium:'Moyen',low:'Faible'};
const CAT_LABEL = {headers:'Headers',ssl:'SSL/TLS',cookies:'Cookies',dns:'DNS',exposure:'Exposition',reputation:'Réputation'};

function scoreClass(s){ return s>=80?'good':s>=50?'mid':'bad'; }
function scoreLabel(s){ return s>=80?'Bon':s>=50?'Score moyen':'Score faible'; }

function timeAgo(iso){
  const d=new Date(iso);
  const diff=Math.floor((Date.now()-d.getTime())/1000);
  if(diff<60)return 'à l\'instant';
  if(diff<3600)return `il y a ${Math.floor(diff/60)}min`;
  if(diff<86400)return `il y a ${Math.floor(diff/3600)}h`;
  return d.toLocaleDateString('fr-FR')+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}

function renderTable(results){
  if(!results.length) return '<div class="empty-state">Aucun résultat pour ce filtre.</div>';
  let html=`<table><thead><tr>
    <th>Vérification</th><th>Mode</th><th>Statut</th><th>Criticité</th><th>Description</th><th>Correction</th>
  </tr></thead><tbody>`;
  for(const r of results){
    const statusBadge = r.status==='pass'?'<span class="bx bx-ok">OK</span>':r.status==='fail'?'<span class="bx bx-fail">Échec</span>':'<span class="bx bx-na">N/A</span>';
    const sevBadge = `<span class="bx ${SEV_BADGE[r.severity]||'bx-na'}">${SEV_LABEL[r.severity]||r.severity}</span>`;
    const modeBadge = r.check_mode==='passive'?'<span class="bx bx-pass">Passif</span>':'<span class="bx bx-actf">Actif</span>';
    html+=`<tr>
      <td class="check-name">${r.check_name}</td>
      <td>${modeBadge}</td>
      <td>${statusBadge}</td>
      <td>${sevBadge}</td>
      <td class="desc-cell">${r.description}</td>
      <td class="rec-cell">${r.recommendation}</td>
    </tr>`;
  }
  return html+'</tbody></table>';
}

function renderPage(data){
  const scan=data.scan;
  allResults=data.results;
  document.getElementById('topbar-url').textContent=scan.url;

  const fails=allResults.filter(r=>r.status==='fail');
  const crits=fails.filter(r=>r.severity==='critical').length;
  const passes=allResults.filter(r=>r.status==='pass').length;
  const sc=scoreClass(scan.score);

  const cats=[...new Set(allResults.map(r=>r.category))];

  document.getElementById('content').innerHTML=`
    <div class="summary-bar">
      <div>
        <div class="score-num ${sc}">${scan.score??'—'}</div>
        <div class="score-lbl">${scoreLabel(scan.score??0)}</div>
      </div>
      <div class="url-info">
        <div class="url">${scan.url}</div>
        <div class="meta">
          <span><i class="bi bi-${scan.mode==='passive'?'eye':'lightning-charge'} me-1"></i>${scan.mode==='passive'?'Scan passif':'Scan actif'}</span>
          <span><i class="bi bi-clock me-1"></i>${timeAgo(scan.created_at)}</span>
          <span><i class="bi bi-check2-circle me-1"></i>${allResults.length} vérifications</span>
        </div>
      </div>
      <div class="summary-stat"><div class="val" style="color:#f87171">${crits}</div><div class="lbl">Critiques</div></div>
      <div class="summary-stat"><div class="val" style="color:#fbbf24">${fails.length-crits}</div><div class="lbl">Autres échecs</div></div>
      <div class="summary-stat"><div class="val" style="color:#4ade80">${passes}</div><div class="lbl">OK</div></div>
    </div>

    <div class="filter-row" id="filter-row">
      <button class="filter-pill active" onclick="filter('all')" data-f="all">Tous (${allResults.length})</button>
      <button class="filter-pill" onclick="filter('fail')" data-f="fail">Échecs (${fails.length})</button>
      ${cats.map(c=>`<button class="filter-pill" onclick="filter('${c}')" data-f="${c}">${CAT_LABEL[c]||c} (${allResults.filter(r=>r.category===c).length})</button>`).join('')}
    </div>

    <div class="results-wrap" id="results-table">
      ${renderTable(allResults)}
    </div>
  `;
}

function filter(f){
  document.querySelectorAll('.filter-pill').forEach(p=>p.classList.toggle('active',p.dataset.f===f));
  let r=allResults;
  if(f==='fail') r=allResults.filter(x=>x.status==='fail');
  else if(f!=='all') r=allResults.filter(x=>x.category===f);
  document.getElementById('results-table').innerHTML=renderTable(r);
}

async function loadUser(){
  try{
    const resp=await fetch('/api/auth/me');
    if(!resp.ok){window.location.href='/login';return;}
    const u=await resp.json();
    document.getElementById('un').textContent=u.username;
    document.getElementById('ue').textContent=u.email;
    document.getElementById('ua').textContent=u.username.slice(0,2).toUpperCase();
  }catch{window.location.href='/login';}
}

async function loadReport(){
  try{
    const resp=await fetch(`/api/scan/${SCAN_ID}/report`);
    if(resp.status===401){window.location.href='/login';return;}
    if(!resp.ok){
      document.getElementById('content').innerHTML='<div class="loading-box" style="color:#f87171">Rapport introuvable.</div>';
      return;
    }
    const data=await resp.json();
    renderPage(data);
  }catch(e){
    document.getElementById('content').innerHTML='<div class="loading-box" style="color:#f87171">Erreur de chargement.</div>';
  }
}

async function logout(){
  await fetch('/api/auth/logout',{method:'POST'});
  window.location.href='/login';
}

loadUser();
loadReport();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
